name: Keplerae
options:
  bundleIdPrefix: com.aistudio
  deploymentTarget:
    iOS: "27.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.0.0
settings:
  base:
    SWIFT_VERSION: 6.0
targets:
  Keplerae:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - Resources
    dependencies:
      - package: GoogleSignIn
        products:
          - GoogleSignIn
          - GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.keplerae.stdy.ios
        PRODUCT_NAME: Keplerae
        MARKETING_VERSION: 1.2
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
