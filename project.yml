name: Keplerae
options:
  bundleIdPrefix: com.aistudio
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: 6.0
targets:
  Keplerae:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.keplerae.stdy.ios
        PRODUCT_NAME: Keplerae
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Kepleræ"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
