name: Compilar Keplerae iOS 1.3

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Resources/**'
      - 'project.yml'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mostrar ambiente
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Instalar XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      - name: Validar estrutura
        run: bash scripts/validate_project.sh

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar app sem assinatura
        run: |
          set -o pipefail
          xcodebuild \
            -project Keplerae.xcodeproj \
            -scheme Keplerae \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee build.log

      - name: Validar app e recursos compilados
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist" | grep '^1.3$'

          test -f "$APP_PATH/Assets.car"

          if [ -f "$APP_PATH/catalog.json" ]; then
            CATALOG="$APP_PATH/catalog.json"
          elif [ -f "$APP_PATH/Resources/catalog.json" ]; then
            CATALOG="$APP_PATH/Resources/catalog.json"
          else
            echo "ERRO: catalog.json não foi empacotado"
            find "$APP_PATH" -maxdepth 3 -type f | sort
            exit 1
          fi

          python3 - "$CATALOG" <<'PY'
          import json, sys
          p=sys.argv[1]
          data=json.load(open(p,encoding='utf-8'))
          assert len(data)==1022, f'catálogo: {len(data)} itens, esperado 1022'
          counts={k:sum(1 for x in data if x['type']==k) for k in ('VIDEO','PDF','AUDIO')}
          assert counts=={'VIDEO':703,'PDF':306,'AUDIO':13}, counts
          print('Catálogo validado:', len(data), counts)
          PY

          for AUDIO in ambient_clock ambient_wind ambient_rain ambient_storm ambient_fire ambient_library ambient_room; do
            if [ ! -f "$APP_PATH/$AUDIO.m4a" ] && [ ! -f "$APP_PATH/Sounds/$AUDIO.m4a" ] && [ ! -f "$APP_PATH/Resources/Sounds/$AUDIO.m4a" ]; then
              echo "ERRO: áudio ausente: $AUDIO.m4a"
              exit 1
            fi
          done

          if ! /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' "$APP_PATH/Info.plist" >/dev/null 2>&1; then
            echo "ERRO: metadados do AppIcon não foram gerados"
            exit 1
          fi

          echo "Recursos principais presentes no .app:"
          find "$APP_PATH" -maxdepth 2 -type f \( -name 'catalog.json' -o -name 'Assets.car' -o -name 'AppIcon*.png' -o -name 'ambient_*.m4a' \) -print | sort
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Empacotar IPA
        run: |
          set -e
          rm -rf Payload Keplerae-1.3-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Keplerae.app
          zip -qry Keplerae-1.3-unsigned.ipa Payload
          ls -lh Keplerae-1.3-unsigned.ipa

      - name: Enviar IPA
        uses: actions/upload-artifact@v4
        with:
          name: Keplerae-1.3-unsigned-IPA
          path: Keplerae-1.3-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Enviar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keplerae-1.3-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
