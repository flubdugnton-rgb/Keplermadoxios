name: Compilar Keplerae iOS 1.5.1

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Resources/**'
      - 'project.yml'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mostrar ambiente
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Instalar XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      - name: Validar estrutura
        run: bash scripts/validate_project.sh

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar app sem assinatura
        run: |
          set -o pipefail
          xcodebuild \
            -project Keplerae.xcodeproj \
            -scheme Keplerae \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee build.log

      - name: Validar app e recursos compilados
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist" | grep '^1.5.1$'
          test -f "$APP_PATH/Assets.car"

          if [ -f "$APP_PATH/catalog.json" ]; then
            CATALOG="$APP_PATH/catalog.json"
          elif [ -f "$APP_PATH/Resources/catalog.json" ]; then
            CATALOG="$APP_PATH/Resources/catalog.json"
          else
            echo "ERRO: catalog.json não foi empacotado"
            exit 1
          fi

          python3 - "$CATALOG" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          assert len(data)==1022
          counts={k:sum(1 for x in data if x['type']==k) for k in ('VIDEO','PDF','AUDIO')}
          assert counts=={'VIDEO':703,'PDF':306,'AUDIO':13}, counts
          print('Catálogo validado:', len(data), counts)
          PY

          find_resource() {
            local name="$1"
            find "$APP_PATH" -type f -name "$name" | head -n 1
          }

          for AUDIO in ambient_clock ambient_wind ambient_rain ambient_storm ambient_fire ambient_library ambient_room; do
            FILE="$(find_resource "$AUDIO.m4a")"
            test -n "$FILE" || { echo "ERRO: áudio ausente: $AUDIO.m4a"; exit 1; }
          done

          for ANIMATION in pomodoro_rest.png pomodoro_fishing.png; do
            FILE="$(find_resource "$ANIMATION")"
            test -n "$FILE" || { echo "ERRO: animação ausente: $ANIMATION"; exit 1; }
          done

          grep -q 'tabViewStyle(.page' Sources/App/RootView.swift
          grep -q 'glassEffect(.regular.interactive()' Sources/App/RootView.swift
          if grep -q 'case subjects' Sources/App/RootView.swift; then
            echo "ERRO: Biblioteca voltou para a barra inferior"
            exit 1
          fi
          grep -q 'AVURLAssetHTTPHeaderFieldsKey' Sources/Views/Player/DrivePlayerView.swift
          grep -q 'Authorization' Sources/Data/DriveContentLoader.swift
          grep -q 'fullScreenCover' Sources/Views/Player/DrivePlayerView.swift
          if find Resources/Animations -name '*.gif' | grep -q .; then
            echo "ERRO: GIF antigo voltou ao projeto"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Empacotar IPA
        run: |
          set -e
          rm -rf Payload Keplerae-1.5.1-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Keplerae.app
          zip -qry Keplerae-1.5.1-unsigned.ipa Payload
          ls -lh Keplerae-1.5.1-unsigned.ipa

      - name: Enviar IPA
        uses: actions/upload-artifact@v4
        with:
          name: Keplerae-1.5.1-unsigned-IPA
          path: Keplerae-1.5.1-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Enviar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keplerae-1.5.1-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
