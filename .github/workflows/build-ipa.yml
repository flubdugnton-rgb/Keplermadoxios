name: Compilar Keplerae iOS 1.0

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'project.yml'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mostrar ambiente
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Instalar XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Validar estrutura
        run: bash scripts/validate_project.sh

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar app sem assinatura
        run: |
          set -o pipefail
          xcodebuild \
            -project Keplerae.xcodeproj \
            -scheme Keplerae \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee build.log

      - name: Validar app compilado
        run: |
          set -e
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Empacotar IPA
        run: |
          set -e
          rm -rf Payload Keplerae-1.0-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Keplerae.app
          zip -qry Keplerae-1.0-unsigned.ipa Payload
          ls -lh Keplerae-1.0-unsigned.ipa

      - name: Enviar IPA
        uses: actions/upload-artifact@v4
        with:
          name: Keplerae-1.0-unsigned-IPA
          path: Keplerae-1.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Enviar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keplerae-1.0-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
