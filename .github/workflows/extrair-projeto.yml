name: Extrair projeto iOS automaticamente

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extrair ZIP e organizar pastas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import shutil
          import re

          root = Path.cwd()

          candidates = list(root.glob('Keplermadoxios-v*-source.zip'))

          def version_key(path: Path):
              match = re.search(r'-v(\d+(?:\.\d+)*)-source\.zip$', path.name)
              if not match:
                  return ()
              return tuple(int(part) for part in match.group(1).split('.'))

          if candidates:
              source = max(candidates, key=version_key)
          else:
              fallback = root / 'Keplermadoxios-bootstrap.zip'
              source = fallback if fallback.is_file() else None

          if source is None or not source.is_file():
              raise SystemExit(
                  'ERRO: envie um arquivo Keplermadoxios-vX.Y-source.zip '
                  'para a raiz do repositório.'
              )

          skip_paths = {
              PurePosixPath('.github/workflows/build-ipa.yml'),
              PurePosixPath('.github/workflows/extrair-projeto.yml'),
          }

          print('ZIP selecionado:', source.name)

          # Limpa recursos obsoletos de versões anteriores que o ZIP novo não usa.
          # Isso evita que arquivos antigos continuem no repositório após a extração.
          animations = root / 'Resources' / 'Animations'
          if animations.exists():
              for old_gif in animations.glob('*.gif'):
                  print('Removendo animação GIF obsoleta:', old_gif.relative_to(root))
                  old_gif.unlink()

          with ZipFile(source) as archive:
              entries = [i for i in archive.infolist() if not i.is_dir()]
              names = [PurePosixPath(i.filename).parts for i in entries]

              wrapper = (
                  names[0][0]
                  if names
                  and all(len(parts) > 1 and parts[0] == names[0][0] for parts in names)
                  else None
              )

              count = 0
              skipped = 0

              for item in entries:
                  parts = PurePosixPath(item.filename).parts

                  if wrapper:
                      parts = parts[1:]

                  if not parts or any(p in ('', '.', '..') for p in parts):
                      raise SystemExit('Caminho inseguro no ZIP: ' + item.filename)

                  if parts[0] == '.git':
                      raise SystemExit('ZIP contém pasta .git inesperada')

                  relative = PurePosixPath(*parts)

                  if relative in skip_paths:
                      print('Ignorando workflow protegido:', relative)
                      skipped += 1
                      continue

                  dest = root.joinpath(*parts)
                  dest.parent.mkdir(parents=True, exist_ok=True)

                  with archive.open(item) as src, dest.open('wb') as dst:
                      shutil.copyfileobj(src, dst)

                  count += 1

          print(f'Extraídos {count} arquivos; {skipped} workflows protegidos ignorados.')
          PY

      - name: Publicar arquivos extraídos na main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
          else
            git commit -m "Extrair e organizar projeto iOS"
            git push origin HEAD:main
          fi
